<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTIMI GROUP — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #070810;
      --bg-2: #0f1119;
      --bg-3: #131623;
      --card: #0f1119;
      --card-2: #1a1d2e;
      --border: rgba(255,255,255,0.06);
      --border-2: rgba(255,255,255,0.12);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --gold: #d4af37;
      --gold-2: #f5d77a;
      --primary: #2563eb;
      --primary-2: #3b82f6;
      --green: #22c55e;
      --green-2: #4ade80;
      --red: #ef4444;
      --orange: #f59e0b;
    }

    html, body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Login Screen */
    .login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border-2);
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .login-box h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--gold);
    }

    .login-box p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .login-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 16px;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
    }

    .login-error {
      color: var(--red);
      margin-top: 12px;
      display: none;
    }

    /* Dashboard */
    .dashboard {
      display: none;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .dashboard.visible {
      display: block;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .header h1 span {
      color: var(--gold);
    }

    .logout-btn {
      padding: 10px 20px;
      background: var(--card-2);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: var(--red);
      color: white;
      border-color: var(--red);
    }

    /* Stats Cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .stat-card .label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
    }

    .stat-card .value.gold { color: var(--gold); }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.blue { color: var(--primary-2); }

    /* Search & Filters */
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 12px 18px;
      background: var(--card);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .refresh-btn {
      padding: 12px 24px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: var(--primary-2);
    }

    /* Client Cards */
    .clients-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .client-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s;
    }

    .client-card:hover {
      border-color: var(--border-2);
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }

    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      cursor: pointer;
      flex-wrap: wrap;
      gap: 12px;
    }

    .client-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .client-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      font-size: 18px;
    }

    .client-name {
      font-size: 18px;
      font-weight: 600;
    }

    .client-email {
      color: var(--text-muted);
      font-size: 14px;
    }

    .client-meta {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .progress-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg);
      border-radius: 20px;
      font-size: 14px;
    }

    .progress-badge .bar {
      width: 60px;
      height: 6px;
      background: var(--bg-3);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-badge .bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .expand-icon {
      font-size: 20px;
      color: var(--text-muted);
      transition: transform 0.3s;
    }

    .client-card.expanded .expand-icon {
      transform: rotate(180deg);
    }

    /* Client Details */
    .client-details {
      display: none;
      padding: 0 24px 24px;
      border-top: 1px solid var(--border);
    }

    .client-card.expanded .client-details {
      display: block;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .detail-section {
      background: var(--bg);
      border-radius: 12px;
      padding: 20px;
    }

    .detail-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row .label {
      color: var(--text-muted);
      font-size: 14px;
    }

    .detail-row .value {
      font-size: 14px;
      font-weight: 500;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }

    .detail-row .value.success {
      color: var(--green);
    }

    .detail-row .value.warning {
      color: var(--orange);
    }

    .detail-row .value.missing {
      color: var(--text-dim);
      font-style: italic;
    }

    /* Roadmap Progress */
    .roadmap-progress {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .step-badge {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .step-badge.done {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
    }

    .step-badge.todo {
      background: rgba(113, 113, 122, 0.2);
      color: var(--text-dim);
    }

    /* File Links */
    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-2);
      text-decoration: none;
      font-size: 14px;
    }

    .file-link:hover {
      text-decoration: underline;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .dashboard { padding: 16px; }
      .header h1 { font-size: 22px; }
      .client-header { padding: 16px; }
      .details-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>OPTIMI GROUP</h1>
      <p>Dashboard Admin - Onboarding</p>
      <input type="password" class="login-input" id="passwordInput" placeholder="Mot de passe admin" onkeypress="if(event.key==='Enter')login()">
      <button class="login-btn" onclick="login()">Connexion</button>
      <p class="login-error" id="loginError">Mot de passe incorrect</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1><span>OPTIMI</span> Admin Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Deconnexion</button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="label">Total Clients</div>
        <div class="value gold" id="statTotal">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Onboarding Complet</div>
        <div class="value green" id="statComplete">-</div>
      </div>
      <div class="stat-card">
        <div class="label">En Cours</div>
        <div class="value blue" id="statInProgress">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Fichiers Uploades</div>
        <div class="value" id="statFiles">-</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un client (nom, email, adresse...)" oninput="filterClients()">
      <button class="refresh-btn" onclick="loadData()">Actualiser</button>
    </div>

    <!-- Clients List -->
    <div class="clients-grid" id="clientsGrid">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Chargement des donnees...</p>
      </div>
    </div>
  </div>

<script>
  // ═══════════════════════════════════════════════════════════════
  // CONFIGURATION
  // ═══════════════════════════════════════════════════════════════
  const SUPABASE_URL = 'https://ojupynkafgzcoxbakdkb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qdXB5bmthZmd6Y294YmFrZGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTA3MjMsImV4cCI6MjA5NjA2NjcyM30.C4fkVfpglut0-C5WpMcf9yExRY8zHOCTU_Zhk0Oa0ys';
  const ADMIN_PASSWORD = 'optimi2024'; // A changer !
  const STORAGE_BUCKET = 'onboarding-documents';

  let supabaseClient = null;
  let allClients = [];

  // Init Supabase
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('Supabase connecte');
  } catch (e) {
    console.error('Erreur Supabase:', e);
  }

  // ═══════════════════════════════════════════════════════════════
  // AUTH
  // ═══════════════════════════════════════════════════════════════
  function login() {
    const password = document.getElementById('passwordInput').value;
    if (password === ADMIN_PASSWORD) {
      sessionStorage.setItem('admin-auth', 'true');
      showDashboard();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('admin-auth');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('visible');
    document.getElementById('passwordInput').value = '';
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('visible');
    loadData();
  }

  // Check auth on load
  if (sessionStorage.getItem('admin-auth') === 'true') {
    showDashboard();
  }

  // ═══════════════════════════════════════════════════════════════
  // LOAD DATA
  // ═══════════════════════════════════════════════════════════════
  async function loadData() {
    const grid = document.getElementById('clientsGrid');
    grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Chargement des donnees...</p></div>';

    try {
      // Load clients
      const { data: clients, error: clientsError } = await supabaseClient
        .from('onboarding_clients')
        .select('*')
        .order('created_at', { ascending: false });

      if (clientsError) throw clientsError;

      // Load all info
      const { data: infos, error: infosError } = await supabaseClient
        .from('onboarding_info')
        .select('*');

      if (infosError) throw infosError;

      // Load all progress
      const { data: progress, error: progressError } = await supabaseClient
        .from('onboarding_progress')
        .select('*');

      if (progressError) throw progressError;

      // Merge data
      allClients = clients.map(client => {
        const info = infos.find(i => i.client_id === client.id) || {};
        const clientProgress = progress.filter(p => p.client_id === client.id);
        const doneSteps = clientProgress.filter(p => p.status === 'done').length;
        const totalSteps = 10; // Fixed number of steps

        return {
          ...client,
          info,
          progress: clientProgress,
          progressPercent: Math.round((doneSteps / totalSteps) * 100),
          doneSteps,
          totalSteps
        };
      });

      // Update stats
      updateStats();

      // Render
      renderClients(allClients);

    } catch (e) {
      console.error('Erreur chargement:', e);
      grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Erreur de chargement. Verifiez la console.</p></div>';
    }
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = allClients.length;

    const complete = allClients.filter(c => c.progressPercent === 100).length;
    document.getElementById('statComplete').textContent = complete;

    const inProgress = allClients.filter(c => c.progressPercent > 0 && c.progressPercent < 100).length;
    document.getElementById('statInProgress').textContent = inProgress;

    const filesCount = allClients.filter(c => c.info.doc_identity_file || c.info.doc_iban_file).length;
    document.getElementById('statFiles').textContent = filesCount;
  }

  // ═══════════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════════
  function renderClients(clients) {
    const grid = document.getElementById('clientsGrid');

    if (clients.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>Aucun client trouve</p></div>';
      return;
    }

    grid.innerHTML = clients.map(client => `
      <div class="client-card" id="card-${client.id}">
        <div class="client-header" onclick="toggleCard('${client.id}')">
          <div class="client-info">
            <div class="client-avatar">${getInitials(client.client_name || client.client_slug)}</div>
            <div>
              <div class="client-name">${client.client_name || client.client_slug || 'Client'}</div>
              <div class="client-email">${client.client_email || client.info.email || '-'}</div>
            </div>
          </div>
          <div class="client-meta">
            <div class="progress-badge">
              <div class="bar"><div class="bar-fill" style="width: ${client.progressPercent}%"></div></div>
              <span>${client.progressPercent}%</span>
            </div>
            <span class="expand-icon">▼</span>
          </div>
        </div>
        <div class="client-details">
          <div class="details-grid">
            <!-- Contact -->
            <div class="detail-section">
              <h3>Contact</h3>
              <div class="detail-row">
                <span class="label">Nom</span>
                <span class="value">${client.client_name || client.info.full_name || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Email</span>
                <span class="value">${client.client_email || client.info.email || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Telephone</span>
                <span class="value">${client.client_phone || client.info.phone || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Contact urgence</span>
                <span class="value">${client.info.emergency_contact_name ? client.info.emergency_contact_name + ' (' + (client.info.emergency_contact_phone || '') + ')' : '-'}</span>
              </div>
            </div>

            <!-- Property -->
            <div class="detail-section">
              <h3>Bien Immobilier</h3>
              <div class="detail-row">
                <span class="label">Adresse</span>
                <span class="value">${client.info.property_full_address || client.property_address || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Etage</span>
                <span class="value">${client.info.property_floor || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Surface</span>
                <span class="value">${client.info.property_surface || client.property_surface || '-'} m²</span>
              </div>
              <div class="detail-row">
                <span class="label">Capacite</span>
                <span class="value">${client.info.property_capacity || '-'} voyageurs</span>
              </div>
              <div class="detail-row">
                <span class="label">Codes acces</span>
                <span class="value">${client.info.property_access_codes || '-'}</span>
              </div>
            </div>

            <!-- WiFi & Equipment -->
            <div class="detail-section">
              <h3>WiFi & Equipements</h3>
              <div class="detail-row">
                <span class="label">Nom WiFi</span>
                <span class="value">${client.info.property_wifi_name || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Mot de passe</span>
                <span class="value">${client.info.property_wifi_password || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Serrure connectee</span>
                <span class="value ${client.info.has_smart_lock === 'true' ? 'success' : ''}">${client.info.has_smart_lock === 'true' ? 'Oui' : client.info.has_smart_lock === 'false' ? 'Non' : client.info.has_smart_lock || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Jeux de cles</span>
                <span class="value">${client.info.keys_count || '-'}</span>
              </div>
            </div>

            <!-- Documents -->
            <div class="detail-section">
              <h3>Documents</h3>
              <div class="detail-row">
                <span class="label">Piece d'identite</span>
                <span class="value ${client.info.doc_identity_file ? 'success' : 'missing'}">${client.info.doc_identity_file ? '✓ Fourni' : 'Non fourni'}</span>
              </div>
              <div class="detail-row">
                <span class="label">RIB / IBAN</span>
                <span class="value ${client.info.doc_iban_file ? 'success' : 'missing'}">${client.info.doc_iban_file ? '✓ Fourni' : 'Non fourni'}</span>
              </div>
              <div class="detail-row">
                <span class="label">N° enregistrement</span>
                <span class="value">${client.info.doc_registration_number || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">N° assurance</span>
                <span class="value">${client.info.doc_insurance || '-'}</span>
              </div>
            </div>

            <!-- Logistics -->
            <div class="detail-section">
              <h3>Logistique</h3>
              <div class="detail-row">
                <span class="label">Date lancement</span>
                <span class="value">${client.info.launch_date || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Dispo shooting</span>
                <span class="value">${client.info.shooting_availability || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="label">Linge de maison</span>
                <span class="value">${formatLinenProvider(client.info.linen_provider)}</span>
              </div>
              <div class="detail-row">
                <span class="label">Commission</span>
                <span class="value">${client.commission_rate || 20}%</span>
              </div>
            </div>

            <!-- Progress -->
            <div class="detail-section">
              <h3>Progression Roadmap (${client.doneSteps}/${client.totalSteps})</h3>
              <div class="roadmap-progress">
                ${renderProgressSteps(client.progress)}
              </div>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderProgressSteps(progress) {
    const steps = [
      { id: 'step-0', name: 'Contrat' },
      { id: 'step-1', name: 'Kickoff' },
      { id: 'step-2', name: 'Infos' },
      { id: 'step-3', name: 'Visite' },
      { id: 'step-4', name: 'Photos' },
      { id: 'step-5', name: 'Annonce' },
      { id: 'step-6', name: 'Validation' },
      { id: 'step-7', name: 'Mise en ligne' },
      { id: 'step-8', name: 'Pricing' },
      { id: 'step-9', name: 'Point etape' }
    ];

    return steps.map(step => {
      const p = progress.find(pr => pr.step_id === step.id);
      const isDone = p && p.status === 'done';
      return `<span class="step-badge ${isDone ? 'done' : 'todo'}">${isDone ? '✓' : '○'} ${step.name}</span>`;
    }).join('');
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.split(/[\s-]+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function formatLinenProvider(value) {
    const map = {
      'owner': 'Proprietaire',
      'optimi': 'Service OPTIMI',
      'discuss': 'A discuter'
    };
    return map[value] || value || '-';
  }

  function toggleCard(id) {
    const card = document.getElementById('card-' + id);
    card.classList.toggle('expanded');
  }

  function filterClients() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allClients.filter(c => {
      const searchable = [
        c.client_name,
        c.client_slug,
        c.client_email,
        c.client_phone,
        c.info.email,
        c.info.phone,
        c.info.property_full_address,
        c.property_address
      ].filter(Boolean).join(' ').toLowerCase();
      return searchable.includes(search);
    });
    renderClients(filtered);
  }
</script>

</body>
</html>
